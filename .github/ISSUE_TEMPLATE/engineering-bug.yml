name: Repository engineering bug
description: Report a reproducible defect in this repository's initializer, contract, staging, or browser shell.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        This repository may still be the generic engineering scaffold or may be an initialized
        scientific application. The replaceable template demonstration is not a validated method.
        Report only behavior owned by this repository; identify the authoritative upstream
        repository when a released core owns the defect. Use only synthetic values here; never
        include protected health information, credentials, unpublished restricted data, or other
        sensitive material.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Initializer or template-state disposable-app self-test
        - Python or scientific contract and strict JSON
        - Browser staging or integrity verification
        - Static UI, accessibility, or exports
        - CI, Pages, release, or repository policy
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exact version or commit
      description: Provide the release tag or full commit SHA where the problem occurs.
      placeholder: v0.1.2 or a 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: List exact commands and synthetic inputs needed to reproduce the problem.
      placeholder: |
        1. uv sync --locked
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Redact local paths, tokens, user values, and sensitive logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python, uv, and browser versions when relevant.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Public-report safety
      options:
        - label: I used only synthetic values and removed credentials, sensitive data, and protected health information.
          required: true
        - label: This report concerns behavior owned by this repository or identifies the authoritative upstream owner.
          required: true
